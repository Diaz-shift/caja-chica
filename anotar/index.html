<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Anotar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF2F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)">
<title>Anotar gasto</title>
<style>
  /* Una sola columna pensada para el pulgar: qué fue (dictado o texto), foto opcional, botón grande.
     Todos los campos van a 17px o más: Safari en iPhone hace zoom en cualquier campo de menos de 16px. */
  :root {
    --bg1:#E6ECF7; --bg2:#F5F6F9;
    --glass:rgba(255,255,255,.72); --glass-edge:rgba(255,255,255,.95); --hair:rgba(17,18,20,.08);
    --ink:#111214; --ink-2:#3C3F47; --muted:#7A7F88;
    --lime:#DDF34A; --lime-2:#C9E236; --lime-ink:#17190B;
    --night:#2A2B2E; --night-ink:#F3F4F6;
    --pos:#178A4C; --crit:#D93A3F; --warn:#A86E00; --rec:#E5484D;
    --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg1:#0B0C0F; --bg2:#14161B;
      --glass:rgba(32,34,40,.72); --glass-edge:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
      --ink:#F4F5F7; --ink-2:#CDD0D6; --muted:#8C919A;
      --night:#1A1B1E; --night-ink:#F3F4F6;
      --pos:#4CC38A; --crit:#FF6B70; --warn:#E3A531;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"] {
    --bg1:#0B0C0F; --bg2:#14161B;
    --glass:rgba(32,34,40,.72); --glass-edge:rgba(255,255,255,.07); --hair:rgba(255,255,255,.08);
    --ink:#F4F5F7; --ink-2:#CDD0D6; --muted:#8C919A;
    --night:#1A1B1E; --night-ink:#F3F4F6;
    --pos:#4CC38A; --crit:#FF6B70; --warn:#E3A531;
    color-scheme:dark;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; }
  body {
    font-family:var(--font); color:var(--ink); font-size:16px; line-height:1.4; -webkit-font-smoothing:antialiased;
    background:linear-gradient(180deg, var(--bg1), var(--bg2) 420px); background-color:var(--bg2); min-height:100vh;
    padding-inline:16px;
    padding-block:calc(14px + env(safe-area-inset-top, 0px)) calc(28px + env(safe-area-inset-bottom, 0px));
  }
  [hidden] { display:none !important; }
  button, textarea, a { font:inherit; color:inherit; }
  main { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }

  header { display:flex; align-items:center; justify-content:space-between; padding:4px 2px; }
  h1 { font-size:28px; letter-spacing:-.02em; margin:0; }
  .link { font-size:15px; color:var(--muted); text-decoration:none; padding:8px 4px; }

  .card { background:var(--glass); border:1px solid var(--glass-edge); border-radius:24px; padding:16px;
          -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); box-shadow:0 8px 30px rgba(17,18,20,.06); }

  textarea {
    width:100%; min-height:132px; resize:vertical; border:0; outline:none; background:transparent;
    font-size:19px; line-height:1.4; color:var(--ink);
  }
  textarea::placeholder { color:var(--muted); }
  .hint { font-size:14px; color:var(--muted); margin:6px 0 0; }

  .tools { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tool {
    display:flex; align-items:center; justify-content:center; gap:8px; min-height:58px; border-radius:18px;
    border:1px solid var(--hair); background:var(--glass); font-size:17px; font-weight:600; cursor:pointer;
  }
  .tool svg { width:22px; height:22px; flex:none; }
  .tool[aria-pressed="true"] { background:var(--rec); color:#fff; border-color:transparent; }
  .tool[aria-pressed="true"] .dot { animation:latido 1s infinite; }
  @keyframes latido { 50% { opacity:.35; } }
  input[type=file] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }

  .foto { position:relative; border-radius:18px; overflow:hidden; border:1px solid var(--hair); }
  .foto img { display:block; width:100%; max-height:260px; object-fit:cover; }
  .foto button { position:absolute; top:8px; right:8px; width:36px; height:36px; border-radius:50%; border:0;
                 background:rgba(0,0,0,.55); color:#fff; font-size:20px; line-height:1; cursor:pointer; }

  .send {
    min-height:62px; border:0; border-radius:20px; background:var(--lime); color:var(--lime-ink);
    font-size:19px; font-weight:700; cursor:pointer;
  }
  .send:disabled { opacity:.45; }

  .res { border-radius:20px; padding:14px 16px; background:var(--night); color:var(--night-ink); font-size:16px; }
  .res b { display:block; font-size:13px; letter-spacing:.04em; text-transform:uppercase; opacity:.7; margin-bottom:4px; }
  .res.ok b { color:var(--lime); opacity:1; }
  .res.warn b { color:#F5C04A; opacity:1; }
  .res.err b { color:#FF8A8E; opacity:1; }
  .res p { margin:6px 0 0; opacity:.8; font-size:15px; }

  h2 { font-size:15px; color:var(--muted); font-weight:600; margin:8px 2px 0; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { background:var(--glass); border:1px solid var(--glass-edge); border-radius:16px; padding:12px 14px; font-size:15px; }
  li .t { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .s { color:var(--muted); font-size:13px; margin-top:2px; }
  li .s.warn { color:var(--warn); } li .s.err { color:var(--crit); } li .s.ok { color:var(--pos); }
  .otros { font-size:14px; color:var(--muted); text-align:center; margin:6px 0 0; }
  .otros a { color:inherit; }
  .setup { text-align:center; padding:28px 16px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Anotar</h1>
    <a class="link" href="../">Panel</a>
  </header>

  <div id="setup" class="card setup" hidden>
    <p><strong>Falta la llave de este teléfono.</strong></p>
    <p class="hint">Abre el link de configuración que te mandó Atenea. Se abre una sola vez.</p>
  </div>

  <form id="f" autocomplete="off">
    <div class="card">
      <label for="texto" class="hint" style="margin:0 0 6px;display:block">¿Qué fue? Monto, moneda y contexto</label>
      <textarea id="texto" name="texto" enterkeyhint="done"
        placeholder="Ej.: 15 mil bolos de cachapas con Yolis en La Castellana"></textarea>
      <p class="hint" id="hintDictado">Para dictar, toca el micrófono del teclado.</p>
    </div>
  </form>

  <div class="tools">
    <button type="button" class="tool" id="mic" aria-pressed="false" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <span id="micTxt">Dictar</span>
    </button>
    <label class="tool" for="foto" id="fotoBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      Foto o captura
    </label>
    <input type="file" id="foto" accept="image/*">
  </div>

  <div class="foto" id="prev" hidden>
    <img id="prevImg" alt="Comprobante adjunto">
    <button type="button" id="quitar" aria-label="Quitar la foto">×</button>
  </div>

  <button type="button" class="send" id="send" disabled>Anotar</button>

  <div class="res" id="res" role="status" aria-live="polite" hidden></div>

  <h2 id="recTitle" hidden>Lo último desde este teléfono</h2>
  <ul id="rec"></ul>

  <p class="otros">¿Compra de dólares, cambio o plata de paso? <a href="https://forms.gle/sL4xGGC8uNVGwWDa7">Formulario</a></p>
</main>

<script>
(function () {
  var URL_SCRIPT = "https://script.google.com/macros/s/AKfycbw7yXgoyXVFc7mBQqHxzNXrRDPbgCy5rFgVcbNARYXZrMfjO4YBAEd3L6PVCPB4eEY/exec";
  var K_TOKEN = "anotar.token", K_COLA = "anotar.cola", K_REC = "anotar.recientes";
  var $ = function (id) { return document.getElementById(id); };
  var foto = null;  // base64 JPEG sin cabecera

  function leer(k, def) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
  function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

  // ---- llave: llega una vez en el link (#k=...). Se queda también en el link para que la copia
  //      de la pantalla de inicio (que en iPhone tiene su propio almacenamiento) la conserve.
  var h = new URLSearchParams(location.hash.slice(1));
  if (h.get("k")) guardar(K_TOKEN, h.get("k"));
  var TOKEN = h.get("k") || leer(K_TOKEN, "");
  if (!TOKEN) { $("setup").hidden = false; }

  // ---- dictado del navegador cuando existe; si no, el micrófono del teclado
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition, rec = null, base = "";
  if (SR) {
    $("mic").hidden = false; $("hintDictado").hidden = true;
  } else {
    $("fotoBtn").style.gridColumn = "1 / -1";
  }
  $("mic").onclick = function () {
    if (rec) { rec.stop(); return; }
    try {
      rec = new SR(); rec.lang = "es-VE"; rec.continuous = true; rec.interimResults = true;
    } catch (e) { sinDictado(); return; }
    base = $("texto").value ? $("texto").value.replace(/\s*$/, " ") : "";
    rec.onresult = function (ev) {
      var t = ""; for (var i = 0; i < ev.results.length; i++) t += ev.results[i][0].transcript;
      $("texto").value = base + t; listo();
    };
    rec.onerror = function (ev) { if (ev.error === "not-allowed" || ev.error === "service-not-allowed") sinDictado(); };
    rec.onend = function () { rec = null; $("mic").setAttribute("aria-pressed", "false"); $("micTxt").textContent = "Dictar"; };
    rec.start();
    $("mic").setAttribute("aria-pressed", "true"); $("micTxt").innerHTML = '<span class="dot">●</span> Escuchando… toca para parar';
  };
  function sinDictado() {
    rec = null; $("mic").hidden = true; $("fotoBtn").style.gridColumn = "1 / -1"; $("hintDictado").hidden = false;
    $("texto").focus();
  }

  // ---- foto: se reduce en el teléfono (lado mayor 1568 px, JPEG) para que suba rápido con mala señal
  $("foto").onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var img = new Image(), u = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1568, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      var c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      var data = c.toDataURL("image/jpeg", 0.78);
      foto = data.split(",")[1];
      $("prevImg").src = data; $("prev").hidden = false;
      URL.revokeObjectURL(u); listo();
    };
    img.onerror = function () { mostrar("err", "No pude abrir esa imagen", "Prueba con una captura de pantalla."); };
    img.src = u;
  };
  $("quitar").onclick = function () { foto = null; $("foto").value = ""; $("prev").hidden = true; listo(); };

  $("texto").addEventListener("input", listo);
  function listo() { $("send").disabled = !TOKEN || (!$("texto").value.trim() && !foto); }

  // ---- enviar (con cola si no hay señal)
  function uid() { return (crypto.randomUUID && crypto.randomUUID()) || Date.now().toString(36) + Math.random().toString(36).slice(2); }
  $("send").onclick = function () {
    if (rec) rec.stop();
    var item = { id: uid(), token: TOKEN, texto: $("texto").value.trim(), foto: foto, cuando: new Date().toISOString() };
    $("texto").value = ""; foto = null; $("foto").value = ""; $("prev").hidden = true; listo();
    anotarReciente(item, "Enviando…", "");
    mandar(item);
  };

  function mandar(item) {
    $("send").disabled = true; $("send").textContent = "Anotando…";
    mostrar("", "Anotando…", "Lo estoy leyendo. Tarda unos segundos.");
    return fetch(URL_SCRIPT, { method: "POST", body: JSON.stringify(item) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error === "no autorizado") { mostrar("err", "La llave de este teléfono no sirve", "Abre de nuevo el link de configuración."); return; }
        if (d.error) throw new Error(d.error);
        sacarDeCola(item.id);
        var est = d.estado;
        if (est === "Procesado") mostrar("ok", "Anotado", d.resultado);
        else if (est === "Revisar") mostrar("warn", "Anotado, pero revísalo", d.resultado + (d.duda ? ". " + d.duda : ""));
        else if (est === "Duplicado") mostrar("warn", "Ya estaba anotado", d.resultado);
        else mostrar("ok", "Recibido", d.resultado || "Quedó en la Bandeja.");
        anotarReciente(item, d.resultado || est, est === "Procesado" || est === "Pendiente" ? "ok" : "warn");
      })
      .catch(function () {
        meterEnCola(item);
        mostrar("warn", "Sin señal: guardado aquí", "Se manda solo cuando vuelva la conexión.");
        anotarReciente(item, "En cola, sin señal", "err");
      })
      .then(function () { $("send").textContent = "Anotar"; listo(); });
  }

  function meterEnCola(item) {
    var c = leer(K_COLA, []).filter(function (x) { return x.id !== item.id; });
    c.push(item);
    if (!guardar(K_COLA, c)) { item.foto = null; c[c.length - 1] = item; guardar(K_COLA, c); }  // sin espacio: al menos el texto
  }
  function sacarDeCola(id) { guardar(K_COLA, leer(K_COLA, []).filter(function (x) { return x.id !== id; })); }
  function vaciarCola() {
    var c = leer(K_COLA, []); if (!c.length || !navigator.onLine) return;
    c.reduce(function (p, item) { return p.then(function () { return mandar(item); }); }, Promise.resolve());
  }
  window.addEventListener("online", vaciarCola);

  function mostrar(cls, titulo, txt) {
    var r = $("res"); r.hidden = false; r.className = "res " + cls; r.textContent = "";
    var b = document.createElement("b"); b.textContent = titulo; r.appendChild(b);
    r.appendChild(document.createTextNode(txt || ""));
  }

  // ---- lo último enviado desde este teléfono (sin fotos, solo texto)
  function anotarReciente(item, estado, cls) {
    var l = leer(K_REC, []).filter(function (x) { return x.id !== item.id; });
    l.unshift({ id: item.id, texto: item.texto || "(solo foto)", cuando: item.cuando, estado: estado, cls: cls });
    guardar(K_REC, l.slice(0, 6)); pintarRecientes();
  }
  function pintarRecientes() {
    var l = leer(K_REC, []), ul = $("rec"); ul.textContent = ""; $("recTitle").hidden = !l.length;
    l.forEach(function (x) {
      var li = document.createElement("li"), t = document.createElement("div"), s = document.createElement("div");
      t.className = "t"; t.textContent = x.texto;
      s.className = "s " + (x.cls || "");
      s.textContent = new Intl.DateTimeFormat("es-VE", { weekday: "short", hour: "numeric", minute: "2-digit" }).format(new Date(x.cuando)) + " · " + x.estado;
      li.appendChild(t); li.appendChild(s); ul.appendChild(li);
    });
  }

  pintarRecientes(); listo(); vaciarCola();
})();
</script>
</body>
</html>
